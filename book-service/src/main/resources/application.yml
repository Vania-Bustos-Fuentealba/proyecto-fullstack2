spring:
  application:
    name: book-service
  datasource:
    url: jdbc:mysql://mysql:3306/book_db
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: logs/book-service.log
  level:
    root: INFO
    com.library.bookservice: DEBUG
