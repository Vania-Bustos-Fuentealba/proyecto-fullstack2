# Entrega integrada: administración, catálogo/pedidos, blog y contacto.
# Los servicios quedan privados; solo se publica el Gateway.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - library-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 3s
      retries: 30
  auth-service:
    build: ./auth-service
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_SESSION_DURATION: ${JWT_SESSION_DURATION:-86400000}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      EUREKA_CLIENT_ENABLED: 'false'
    depends_on:
      mysql: {condition: service_healthy}
  user-service:
    build: ./user-service
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_ENABLED: 'false'
    depends_on:
      mysql: {condition: service_healthy}
  book-service:
    build: ./book-service
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_ENABLED: 'false'
    depends_on:
      mysql: {condition: service_healthy}
  content-service:
    build: ./content-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/content_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SERVER_PORT: 8080
      EUREKA_CLIENT_ENABLED: 'false'
    depends_on:
      mysql: {condition: service_healthy}
  api-gateway:
    build: ./api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      EUREKA_CLIENT_ENABLED: 'false'
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:8080'
    depends_on: [auth-service, user-service, book-service, content-service]
volumes:
  library-data:
