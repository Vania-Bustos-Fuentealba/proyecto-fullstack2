spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Solo el esquema OpenAPI: las operaciones conservan su filtro JWT.
            - id: openapi-auth
              uri: http://auth-service:8080
              predicates:
                - Path=/openapi/auth
                - Method=GET
              filters:
                - SetPath=/v3/api-docs

            # Solo el esquema OpenAPI: las operaciones conservan su filtro JWT.
            - id: openapi-users
              uri: http://user-service:8080
              predicates:
                - Path=/openapi/users
                - Method=GET
              filters:
                - SetPath=/v3/api-docs

            # Solo el esquema OpenAPI: las operaciones conservan su filtro JWT.
            - id: openapi-books
              uri: http://book-service:8080
              predicates:
                - Path=/openapi/books
                - Method=GET
              filters:
                - SetPath=/v3/api-docs

            # Solo el esquema OpenAPI: las operaciones conservan su filtro JWT.
            - id: openapi-content
              uri: http://content-service:8080
              predicates:
                - Path=/openapi/content
                - Method=GET
              filters:
                - SetPath=/v3/api-docs

            - id: auth-public
              uri: http://auth-service:8080
              predicates:
                - Path=/auth/login,/auth/register

            - id: auth-protected
              uri: http://auth-service:8080
              predicates:
                - Path=/auth/users/**,/auth/session,/auth/refresh
              filters:
                - jwtFilter

            - id: book-service
              uri: http://book-service:8080
              predicates:
                - Path=/books/**
              filters:
                - jwtFilter

            # Pedidos de Vale usan los mismos libros y la misma transacción de stock.
            - id: pedidos-tienda
              uri: http://book-service:8080
              predicates:
                - Path=/pedidos/**
              filters:
                - jwtFilter

            - id: cart-service
              uri: http://cart-service:8080
              predicates:
                - Path=/cart/**
              filters:
                - jwtFilter

            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/orders/**
              filters:
                - jwtFilter

            - id: inventory-service
              uri: http://inventory-service:8080
              predicates:
                - Path=/inventory/**
              filters:
                - jwtFilter

            - id: review-service
              uri: http://review-service:8080
              predicates:
                - Path=/reviews/**
              filters:
                - jwtFilter

            - id: payment-service
              uri: http://payment-service:8080
              predicates:
                - Path=/payments/**
              filters:
                - jwtFilter

            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/users/**
              filters:
                - jwtFilter

            - id: notification-service
              uri: http://notification-service:8080
              predicates:
                - Path=/notifications/**
              filters:
                - jwtFilter

            - id: recommendation-service
              uri: http://recommendation-service:8080
              predicates:
                - Path=/recommendations/**
              filters:
                - jwtFilter

            - id: content-service
              uri: http://content-service:8080
              predicates:
                - Path=/v1/posts/**,/v1/contact/**
              filters:
                - jwtFilter

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}

# Swagger central permite demostrar las API sin publicar puertos internos.
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: Autenticacion y cuentas
        url: /openapi/auth
      - name: Perfiles de usuarios
        url: /openapi/users
      - name: Libros y pedidos
        url: /openapi/books
      - name: Blog y contacto
        url: /openapi/content
